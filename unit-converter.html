    <nav>

      <button class="lang-btn active" data-lang="en">EN</button>

  <!-- TOOL HERO -->
  <section class="tool-hero">
    <a href="index.html#tools" class="back-link" data-en="← Back to Tools" data-hi="← टूल्स पर वापस जाएँ">← Back to Tools</a>
    <h1 data-en="🔄 Unit Converter" data-hi="🔄 यूनिट कन्वर्टर">🔄 Unit Converter</h1>
    <p data-en="Convert length, weight, temperature, area, volume, speed and time instantly." data-hi="लंबाई, वज़न, तापमान, क्षेत्र, आयतन, गति और समय तुरंत बदलें।">Convert length, weight, temperature, area, volume, speed and time instantly.</p>
  </section>

  <!-- TOOL MAIN -->
  <section class="tool-container">

    <!-- Category Selector -->
    <div class="unit-categories">
      <button class="unit-cat-btn active" data-cat="length">📏 <span data-en="Length" data-hi="लंबाई">Length</span></button>
      <button class="unit-cat-btn" data-cat="weight">⚖️ <span data-en="Weight" data-hi="वज़न">Weight</span></button>
      <button class="unit-cat-btn" data-cat="temperature">🌡️ <span data-en="Temperature" data-hi="तापमान">Temperature</span></button>
      <button class="unit-cat-btn" data-cat="area">📐 <span data-en="Area" data-hi="क्षेत्र">Area</span></button>
      <button class="unit-cat-btn" data-cat="volume">🧪 <span data-en="Volume" data-hi="आयतन">Volume</span></button>
      <button class="unit-cat-btn" data-cat="speed">🏎️ <span data-en="Speed" data-hi="गति">Speed</span></button>
      <button class="unit-cat-btn" data-cat="time">⏰ <span data-en="Time" data-hi="समय">Time</span></button>
      <button class="unit-cat-btn" data-cat="data">💾 <span data-en="Data" data-hi="डेटा">Data</span></button>
    </div>

    <!-- Converter Box -->
    <div class="tool-box">
      <div class="converter-row">
        <div class="input-group">
          <label data-en="From" data-hi="से">From</label>
          <input type="number" id="fromValue" placeholder="1" step="any">
          <select id="fromUnit"></select>
        </div>

        <button id="swapBtn" class="swap-btn" title="Swap Units">⇅</button>

        <div class="input-group">
          <label data-en="To" data-hi="को">To</label>
          <input type="number" id="toValue" placeholder="0" readonly>
          <select id="toUnit"></select>
        </div>
      </div>

      <div class="converter-result" id="converterResult">
        <span id="resultText">—</span>
      </div>

      <div class="tool-actions" style="justify-content:center;">
        <button id="copyConvBtn" class="btn-secondary">📋 <span data-en="Copy Result" data-hi="परिणाम कॉपी करें">Copy Result</span></button>
        <button id="resetConvBtn" class="btn-danger">🗑️ <span data-en="Reset" data-hi="रीसेट">Reset</span></button>
      </div>
    </div>

    <!-- Quick Reference -->
    <div class="tool-box">
      <h3 style="margin-bottom:15px; color:#111827;" data-en="📐 Quick Conversions" data-hi="📐 त्वरित रूपांतरण">📐 Quick Conversions</h3>
      <div class="quick-ref" id="quickRef"></div>
