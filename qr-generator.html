  <section class="tool-container">

      <label for="qrInput" style="display:block; margin-bottom:10px; font-weight:600; color:#374151;">

        <button id="generateBtn" class="btn-secondary">✨ Generate QR</button>
        <button id="downloadBtn" class="btn-danger" disabled>⬇️ Download</button>

      <h3 style="text-align:center; color:#111827; margin-bottom:20px;">Tumhara QR Code</h3>
