<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo" style="text-decoration: none;">
      <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563eb"/>
            <stop offset="100%" style="stop-color:#7c3aed"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#logoGrad)"/>
        <path d="M10 12 L16 8 L22 12 L22 20 L16 24 L10 20 Z" fill="white" opacity="0.95"/>
        <circle cx="16" cy="16" r="3" fill="#2563eb"/>

      <span>ProToolsHub</span>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#tools">Tools</a>
      <a href="index.html#products">Products</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <!-- TOOL HERO -->
  <section class="tool-hero">
    <a href="index.html#tools" class="back-link">← Wapas Tools par jao</a>
    <h1>🔐 Password Generator</h1>
    <p>Strong aur secure password banao — turant, offline, free.</p>
  </section>

  <!-- TOOL MAIN -->
  <section class="tool-container">
    
    <!-- Password Display -->
    <div class="tool-box">
      <div class="password-display">
        <input type="text" id="passwordOutput" readonly value="Click Generate">
        <button id="copyBtn" class="copy-icon" title="Copy">📋</button>
      </div>

      <!-- Strength Meter -->
      <div class="strength-meter">
        <div class="strength-bar" id="strengthBar"></div>
      </div>
      <p class="strength-text" id="strengthText">—</p>

      <button id="generateBtn" class="btn-secondary" style="width:100%; padding:15px; font-size:17px; margin-top:15px;">
        🎲 Generate Password
      </button>
    </div>

    <!-- Options -->
    <div class="tool-box">
      <label style="display:block; margin-bottom:15px; font-weight:600; color:#374151;">
        Password Length: <span id="lengthValue">16</span>
      </label>
      <input type="range" id="lengthSlider" min="4" max="64" value="16" style="width:100%;">
      
      <div class="options-grid">
        <label class="checkbox-label">
          <input type="checkbox" id="useUpper" checked>
          <span>ABC (Uppercase)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="useLower" checked>
          <span>abc (Lowercase)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="useNumbers" checked>
          <span>123 (Numbers)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="useSymbols" checked>
          <span>!@# (Symbols)</span>
        </label>
      </div>
    </div>

  </section>

  <!-- FOOTER -->
